

services:
# Tu aplicación FastAPI / Backend
  web:
    build: .
    container_name: estudiantes_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
      - UV_LINK_MODE=copy
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      - postgres_db
    networks:
      - backend-network
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  # Base de Datos PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

  # Admin visual (Adminer)
  adminer:
    image: adminer:latest
    container_name: db_adminer
    restart: always
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres_db
    networks:
      - backend-network
    depends_on:
      - postgres_db

volumes:
  postgres_data:
    driver: local

networks:
  backend-network:
    driver: bridge