

services:
  # Base de Datos PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network

  # Admin visual (Adminer)
  adminer:
    image: adminer:latest
    container_name: db_adminer
    restart: always
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres_db
    networks:
      - backend-network
    depends_on:
      - postgres_db

volumes:
  postgres_data:
    driver: local

networks:
  backend-network:
    driver: bridge